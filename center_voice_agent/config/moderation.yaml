# Regex (re.IGNORECASE) — перефраз и пробелы между словами
blocked_input_patterns:
  - "как\\s+(сделать|собрать|изготовить)\\s+(бомб|взрыв)"
  - "как\\s+(убить|зарезать|задушить)"
  - "где\\s+ты\\s+(жив|живёш|живеш)"
  - "твой\\s+(адрес|номер|телефон)"
  - "парол(ь|и)\\s+(от|к)"

blocked_output_patterns:
  - "парол(ь|и)\\s*[:=]"
  - "твой\\s+(адрес|телефон|номер)"

