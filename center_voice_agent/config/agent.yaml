# Поведение агента (не секреты). Секреты — только в .env (см. Settings).
# short_term_max_pairs: 15  → 30 сообщений (15 пар user+assistant)
short_term_max_pairs: 15
short_term_max_messages: 30
default_max_tool_rounds: 10
memory_prefetch_limit: 8
log_file_path: logs/agent.log
log_file_max_bytes: 5000000
log_file_backup_count: 3
security_incidents_path: data/security_incidents.jsonl
security_incidents_max_bytes: 1000000
# Относительно center_voice_agent/, если нет LLM_API_KEY в .env
openai_fallback_env_relative: ../voice_assistant/.env
