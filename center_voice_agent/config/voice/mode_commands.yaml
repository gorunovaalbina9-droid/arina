# Фразы для смены режима (нормализация: нижний регистр, пробелы схлопываются).
# Длинные фразы проверяются раньше коротких.
entries:
  - mode_id: dialog
    phrases:
      - "переключись в диалоговый"
      - "диалоговый режим"
  - mode_id: lesson
    phrases:
      - "переключись в учебный"
      - "учебный режим"
      - "режим занятия"
  - mode_id: play
    phrases:
      - "переключись в игровой"
      - "игровой режим"
  - mode_id: calm
    phrases:
      - "переключись в спокойный"
      - "спокойный режим"
