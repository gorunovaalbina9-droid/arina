[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "center-voice-agent"
version = "0.1.0"
description = "LangChain-обёртка голосового наставника"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "structlog>=24.0",
  "SQLAlchemy>=2.0",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6.0"]
api = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
center-agent-init-db = "center_voice_agent.cli.init_db:main"
center-agent-demo = "center_voice_agent.cli.demo_turn:main"
center-agent-setup-check = "center_voice_agent.cli.setup_check:main"
center-agent-block2-offline = "center_voice_agent.cli.block2_offline:main"
center-agent-purge-child = "center_voice_agent.cli.purge_child:main"
center-agent-reload-scenarios = "center_voice_agent.cli.reload_scenarios:main"
center-agent-parent-progress = "center_voice_agent.cli.parent_progress_report:main"
center-agent-api = "center_voice_agent.api.main:main"

[tool.setuptools.packages.find]
where = ["src"]
