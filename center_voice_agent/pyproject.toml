[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "center-voice-agent"
version = "0.1.0"
description = "LangChain-обёртка голосового наставника"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "structlog>=24.0",
  "SQLAlchemy>=2.0",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6.0"]
api = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0"]
redis = ["redis>=5.0"]
postgres = ["asyncpg>=0.29", "psycopg[binary]>=3.1"]
alembic = ["alembic>=1.13", "psycopg[binary]>=3.1"]
mcp = ["mcp>=1.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
center-agent-init-db = "center_voice_agent.cli.run_async:init_db_entry"
center-agent-demo = "center_voice_agent.cli.run_async:demo_turn_entry"
center-agent-setup-check = "center_voice_agent.cli.setup_check:main"
center-agent-block2-offline = "center_voice_agent.cli.run_async:block2_offline_entry"
center-agent-purge-child = "center_voice_agent.cli.purge_child:main"
center-agent-reload-scenarios = "center_voice_agent.cli.reload_scenarios:main"
center-agent-reload-catalog = "center_voice_agent.cli.reload_catalog:main"
center-agent-reload-modes = "center_voice_agent.cli.reload_modes:main"
center-agent-parent-progress = "center_voice_agent.cli.parent_progress_report:main"
center-agent-api = "center_voice_agent.api.main:main"
center-agent-mcp = "center_voice_agent.mcp.server:main"
center-agent-create-child = "center_voice_agent.cli.run_async:create_child_entry"
center-agent-text-turn = "center_voice_agent.cli.run_async:text_turn_entry"
center-agent-live-turn = "center_voice_agent.cli.run_async:live_turn_entry"
center-agent-memory-roundtrip = "center_voice_agent.cli.run_async:memory_roundtrip_entry"
center-agent-modes-publish = "center_voice_agent.cli.modes_publish:main"
center-agent-scenarios-publish = "center_voice_agent.cli.scenarios_publish:main"
center-agent-live-acceptance = "center_voice_agent.cli.live_acceptance:main"
center-agent-sync-llm-env = "center_voice_agent.cli.sync_llm_env:main"
center-agent-retention-purge = "center_voice_agent.cli.retention_purge:main"

[tool.setuptools.packages.find]
where = ["src"]
